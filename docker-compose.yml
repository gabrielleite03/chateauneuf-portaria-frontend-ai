services:
  network-auth-service:
    image: ${AUTH_IMAGE:-gabrielleite03/chateauneuf-auth:2026.09.03.3}
    ports:
      - "${AUTH_HTTP_PORT:-80}:8080"
      - "${AUTH_PORT:-8080}:8080"
    build:
      context: ../chateauneuf-auth
      dockerfile: Dockerfile
    environment:
      APP_PORT: 8080
      APP_ENV: production
      OMADA_MOCK: ${OMADA_MOCK:-false}
      OMADA_BASE_URL: ${OMADA_BASE_URL:-}
      OMADA_USERNAME: ${OMADA_USERNAME:-}
      OMADA_PASSWORD: ${OMADA_PASSWORD:-}
      OMADA_SITE: ${OMADA_SITE:-Chateauneuf}
      OMADA_CONTROLLER_ID: ${OMADA_CONTROLLER_ID:-}
      OMADA_TLS_INSECURE: ${OMADA_TLS_INSECURE:-false}
      OMADA_REVOCATION_PATH: ${OMADA_REVOCATION_PATH:-}
      OMADA_OPENAPI_CLIENT_ID: ${OMADA_OPENAPI_CLIENT_ID:-}
      OMADA_OPENAPI_CLIENT_SECRET: ${OMADA_OPENAPI_CLIENT_SECRET:-}
      OMADA_OPENAPI_OMADAC_ID: ${OMADA_OPENAPI_OMADAC_ID:-}
      OMADA_SITE_ID: ${OMADA_SITE_ID:-}
      ADMIN_API_TOKEN: ${AUTH_ADMIN_TOKEN:?AUTH_ADMIN_TOKEN obrigatorio}
      EMPLOYEE_ENROLLMENT_PASSWORD: ${EMPLOYEE_ENROLLMENT_PASSWORD:?EMPLOYEE_ENROLLMENT_PASSWORD obrigatorio}
      CLIENT_AUTH_DURATION: ${CLIENT_AUTH_DURATION:-2160h}
      EMPLOYEE_AUTH_DURATION: ${EMPLOYEE_AUTH_DURATION:-720h}
      RESIDENTS_API_URL: http://backend:8080/api/residents
      RESIDENT_CREDENTIAL_NOTIFICATION_URL: http://backend:8080/internal/residents/internet-credentials
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN obrigatorio}
      USERS_FILE: /app/data/users.json
    volumes:
      - ${LOCAL_AUTH_DATA_DIR:-./auth-data}:/app/data
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-gabrielleite03/chateauneuf-portaria-backend:2026.09.22.2}
    user: "0:0"
    build:
      context: ../chateauneuf-portaria-backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${BACKEND_APP_VERSION:-2026.09.22.2}
        GIT_COMMIT: ${BACKEND_GIT_COMMIT:-unknown}
    environment:
      HTTP_ADDR: :8080
      DATABASE_PATH: /app/data/portaria.db
      MIGRATIONS_PATH: /app/migrations
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8081}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_SHEET_NAME: ${GOOGLE_SHEET_NAME:-Entradas}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_CREDENTIALS_FILE: /run/secrets/google-service-account.json
      PHOTO_STORAGE_DIR: /app/photos
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-30}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_BCC: ${SMTP_BCC:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN obrigatorio}
    volumes:
      - ${LOCAL_DATA_DIR:-./data}:/app/data
      - ${LOCAL_PHOTO_DIR:-./photos}:/app/photos
      - ./secrets:/run/secrets:ro
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    restart: unless-stopped

  stream:
    image: ${STREAM_IMAGE:-gabrielleite03/chateauneuf-stream:2026.09.02.5}
    environment:
      SERVER_PORT: :8082
      VD5116_HOST: ${VD5116_HOST:-192.168.10.101}
      VD5116_PORT: ${VD5116_PORT:-7625}
      VD5116_HTTP_PORT: ${VD5116_HTTP_PORT:-7625}
      VD5116_RTSP_PORT: ${VD5116_RTSP_PORT:-7618}
      VD5116_USERNAME: ${VD5116_USERNAME:-admin}
      VD5116_PASSWORD: ${VD5116_PASSWORD:-admin}
      VD5116_RTSP_URL: ${VD5116_RTSP_URL:-rtsp://admin:admin@192.168.10.101:7618/cam/realmonitor?channel=1&subtype=0}
    ports:
      - "${STREAM_PORT:-18082}:8082"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-gabrielleite03/chateauneuf-portaria-frontend:2026.09.22.2}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${FRONTEND_APP_VERSION:-2026.09.22.2}
        GIT_COMMIT: ${FRONTEND_GIT_COMMIT:-unknown}
    depends_on:
      - backend
      - network-auth-service
      - stream
    environment:
      AUTH_ADMIN_TOKEN: ${AUTH_ADMIN_TOKEN:?AUTH_ADMIN_TOKEN obrigatorio}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
      - "${FRONTEND_HTTPS_PORT:-8443}:443"
    volumes:
      - ${LOCAL_CERT_DIR:-./certs}/localhost.crt:/etc/nginx/certs/localhost.crt:ro
      - ${LOCAL_CERT_DIR:-./certs}/localhost.key:/etc/nginx/certs/localhost.key:ro
    restart: unless-stopped
